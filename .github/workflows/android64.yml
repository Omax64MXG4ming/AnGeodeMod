
name: Build Geode Mod Android64

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release
      - name: Install SDK binaries
        run: geode sdk install-binaries
      - name: Verify output
        shell: bash
        run: |
          set -e

          echo "Build output:"
          find "${{ steps.build.outputs.build-output }}" \
            -maxdepth 1 -type f -name "*.geode"

          test -n "$(find \
            "${{ steps.build.outputs.build-output }}" \
            -maxdepth 1 -type f -name "*.geode" -print -quit)"

      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
