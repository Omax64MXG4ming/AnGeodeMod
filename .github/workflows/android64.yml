name: Build Geode Mod Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK 27.2
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Verify NDK
        run: |
          ls "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ls "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          android-ndk-version: 27.2.12479018
          build-config: Release
          use-cpm-cache: false

      - name: Upload Android64
        uses: actions/upload-artifact@v4
        with:
          name: AnGeodeMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
