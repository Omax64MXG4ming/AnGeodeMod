name: Build AnGeodeMod Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android64:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19

          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-ar-19 /usr/local/bin/llvm-ar

          clang --version
          clang++ --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: nightly
          build-config: Release
          android-ndk-version: 27.2.12479018
          use-cpm-cache: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGeodeMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
