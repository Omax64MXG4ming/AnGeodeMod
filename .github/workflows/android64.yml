name: Build AnGeodeMod Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android64:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean Build Directory
        run: |
          rm -rf build
          rm -rf .cache
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"

          $ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: nightly
          build-config: Release
          android-ndk-version: 28.0.13004108
          use-cpm-cache: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGeodeMod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
