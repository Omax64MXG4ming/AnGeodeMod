name: Setup Tools

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 1. Permisos necesarios para poder subir archivos al repositorio
permissions:
  contents: write

jobs:
  compilar-y-subir:
    runs-on: ubuntu-latest

    steps:
      # 2. Descarga el código
      - name: Download Repo
        uses: actions/checkout@v4

      # 3. Instala las herramientas
      - name: Install Clang, LLVM, CMake and Git
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools lld llvm cmake git


      # 5. Guarda y sube los archivos nuevos o modificados al repositorio
      - name: Push
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Push Changes
          git diff-index --quiet HEAD || git commit -m "chore: agregar archivos generados por workflow [skip ci]"
          git push
