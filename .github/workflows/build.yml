name: Build AnGeodeMod Multi-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android SDK and NDK
      - name: Setup Android SDK
        if: matrix.config.target == 'Android64'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        if: matrix.config.target == 'Android64'
        shell: bash
        run: |
          sdkmanager --install "ndk;30.0.16248370"

      # Verify C++20/23 Support
      - name: Verify C++20/23 Support
        if: matrix.config.target == 'Android64'
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          "$CXX" --version

          cat > /tmp/check.cpp <<'EOF'
          #include <atomic>
          #include <type_traits>

          int main() {
              int value = 0;
              std::atomic_ref<int> ref(value);

              static_assert(
                  std::is_trivially_default_constructible_v<int>
              );

              return ref.load();
          }
          EOF

          "$CXX" \
            --target=aarch64-none-linux-android23 \
            -std=c++23 \
            -fsyntax-only /tmp/check.cpp

      # Build
      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          sdk: nightly
          build-config: Release
          android-ndk-version: 30.0.16248370
          use-cpm-cache: false
          combine: true

      # Inspect Geode HTTP API
      - name: Inspect Geode HTTP API
        if: matrix.config.target == 'Android64'
        shell: bash
        run: |
          echo "======================================"
          echo "       GEODE SDK HTTP INSPECTION"
          echo "======================================"

          echo ""
          echo "=== Workspace ==="
          pwd
          ls -la

          echo ""
          echo "=== SDK headers ==="
          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "web.hpp" -o -name "Event.hpp" \) \
            -print 2>/dev/null || true

          echo ""
          echo "=== CCHttpClient / CCHttpRequest ==="
          grep -R -n -E \
            "class CCHttpClient|class CCHttpRequest" \
            "$GITHUB_WORKSPACE" \
            --include="*.hpp" \
            --include="*.h" \
            --include="*.cpp" || true

          echo ""
          echo "=== HTTP request / response methods ==="
          grep -R -n -E \
            "sendRequest|onResponse|CCHttpResponse" \
            "$GITHUB_WORKSPACE" \
            --include="*.hpp" \
            --include="*.h" \
            --include="*.cpp" || true

          echo ""
          echo "======================================"
          echo "          INSPECTION FINISHED"
          echo "======================================"

  # Combine all platforms
  package:
    name: Combine Multi-Platform Builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine Geode Builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnGeodeMod-MultiPlatform
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
